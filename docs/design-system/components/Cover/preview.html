<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Quizuu</title>
<style>
html,body{margin:0;height:288px;background:var(--surface);overflow:hidden}
.wrap{position:relative;width:960px;height:288px}
svg{position:absolute;left:0;top:0}
.stage{fill:var(--stage)}
.red{fill:var(--answer-red)} .orange{fill:var(--answer-orange)} .yellow{fill:var(--answer-yellow)} .purple{fill:var(--answer-purple)}
.ink{fill:var(--on-color)} .inkdark{fill:#22103a}
.tile{rx:var(--radius-md);ry:var(--radius-md)}
.name{position:absolute;left:48px;bottom:56px;margin:0;font:800 120px/.92 var(--font-display);color:var(--ink-strong);max-width:440px}
.tag{position:absolute;left:52px;bottom:28px;margin:0;font:500 14px/20px var(--font-body);color:var(--ink-muted);max-width:440px}
</style></head>
<body>
<div class="wrap">
<!--
blocks: stage 432×288 (bleeds top and right), four answer tiles 120×120 in answer-red, answer-orange, answer-yellow, answer-purple
arrangement: one tall stage slab with a staggered 2×2 of answer tiles, the right column dropped by space-12
pattern: literal motif, the four answer shapes (triangle, diamond, circle, square) in on-color, because every answer in Quizuu is a colour plus a shape
scales: gap space-6 (24px), stagger space-12 (48px), corners radius-md
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <rect class="stage" x="528" y="0" width="432" height="288"/>
  <rect class="tile red" x="600" y="12" width="120" height="120"/>
  <path class="ink" d="M660 44 692 100H628z"/>
  <rect class="tile orange" x="744" y="60" width="120" height="120"/>
  <path class="ink" d="M804 88 832 120 804 152 776 120z"/>
  <rect class="tile yellow" x="600" y="156" width="120" height="120"/>
  <circle class="inkdark" cx="660" cy="216" r="28"/>
  <rect class="tile purple" x="744" y="204" width="120" height="120"/>
  <rect class="ink" x="780" y="236" width="48" height="48" rx="6"/>
</svg>
<h1 class="name">Quizuu</h1>
<p class="tag">Quiz ao vivo para eventos e escolas.</p>
</div>
</body>
</html>
